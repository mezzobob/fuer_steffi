<!DOCTYPE html> <html lang="de"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Blitzblick bis 10</title> <style> :root { --dot-size: 58px; --gap: 14px; --big-gap: 30px; } * { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f7f7f7; color: #222; min-height: 100vh; display: flex; flex-direction: column; } header { text-align: center; padding: 22px 16px 8px; } h1 { margin: 0; font-size: 32px; } .subtitle { margin-top: 8px; color: #555; font-size: 17px; } main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 20px; } .card { width: min(1050px, 96vw); background: white; border-radius: 18px; padding: 34px 28px; box-shadow: 0 4px 18px rgba(0,0,0,.08); } .dots-wrap { overflow-x: auto; padding: 16px 8px; } .dots { display: flex; align-items: center; justify-content: center; gap: var(--gap); min-width: max-content; } .dot { width: var(--dot-size); height: var(--dot-size); border-radius: 50%; border: 4px solid #333; background: white; flex: 0 0 auto; } .dot:nth-child(6) { margin-left: calc(var(--big-gap) - var(--gap)); } .red { background: #e53935; } .blue { background: #1e88e5; } .hidden-dot { background: white !important; } .mask .dot { visibility: hidden; } .answer { text-align: center; font-size: 72px; font-weight: 700; min-height: 86px; } .controls { width: min(1050px, 96vw); display: flex; flex-wrap: wrap; justify-content: center; align-items: end; gap: 14px; } .control-group { display: flex; flex-direction: column; gap: 6px; } label { font-size: 14px; font-weight: 700; } select, button { font-size: 17px; border-radius: 10px; padding: 11px 14px; } select { border: 1px solid #aaa; background: white; } button { border: none; cursor: pointer; font-weight: 700; } .primary { background: #2e7d32; color: white; } .secondary { background: #e8e8e8; color: #222; } .status { text-align: center; font-size: 16px; min-height: 22px; color: #555; } footer { text-align: center; padding: 12px 16px 20px; color: #777; font-size: 13px; } @media (max-width: 800px) { :root { --dot-size: 42px; --gap: 9px; --big-gap: 20px; } h1 { font-size: 26px; } .answer { font-size: 56px; } .card { padding: 22px 12px; } } </style> </head> <body> <header> <h1>Blitzblick bis 10</h1> <div class="subtitle">10 Punkte in einer Reihe – nach 5 Punkten eine kleine größere Lücke</div> </header> <main> <section class="card"> <div class="dots-wrap"> <div id="dots" class="dots" aria-label="Punktebild"></div> </div> <div id="answer" class="answer"></div> <div id="status" class="status">Klicke auf „Blitz starten“.</div> </section> <section class="controls"> <div class="control-group"> <label for="duration">Blitzzeit</label> <select id="duration"> <option value="300">0,3 Sekunden</option> <option value="500">0,5 Sekunden</option> <option value="800">0,8 Sekunden</option> <option value="1000" selected>1 Sekunde</option> <option value="1500">1,5 Sekunden</option> <option value="2000">2 Sekunden</option> <option value="3000">3 Sekunden</option> </select> </div> <div class="control-group"> <label for="minNumber">Kleinste Zahl</label> <select id="minNumber"></select> </div> <div class="control-group"> <label for="maxNumber">Größte Zahl</label> <select id="maxNumber"></select> </div> <button id="startBtn" class="primary">Blitz starten</button> <button id="showBtn" class="secondary">Punkte zeigen</button> <button id="answerBtn" class="secondary">Lösung zeigen</button> </section> </main> <footer> Füllregel: 1–5 rot, 6–10 blau; immer lückenlos von links nach rechts. </footer> <script> const dotsEl = document.getElementById('dots'); const answerEl = document.getElementById('answer'); const statusEl = document.getElementById('status'); const durationEl = document.getElementById('duration'); const minEl = document.getElementById('minNumber'); const maxEl = document.getElementById('maxNumber'); const startBtn = document.getElementById('startBtn'); const showBtn = document.getElementById('showBtn'); const answerBtn = document.getElementById('answerBtn'); let currentNumber = 6; let timer = null; for (let i = 1; i <= 10; i++) { const o1 = document.createElement('option'); o1.value = i; o1.textContent = i; minEl.appendChild(o1); const o2 = document.createElement('option'); o2.value = i; o2.textContent = i; maxEl.appendChild(o2); } minEl.value = "1"; maxEl.value = "10"; function renderDots(number, hidden = false) { dotsEl.innerHTML = ''; dotsEl.classList.toggle('mask', hidden); for (let i = 1; i <= 10; i++) { const dot = document.createElement('div'); dot.className = 'dot'; if (i <= number) { if (i <= 5) dot.classList.add('red'); else dot.classList.add('blue'); } else { dot.classList.add('hidden-dot'); } dotsEl.appendChild(dot); } } function randomNumber() { let min = Number(minEl.value); let max = Number(maxEl.value); if (min > max) { [min, max] = [max, min]; minEl.value = min; maxEl.value = max; } return Math.floor(Math.random() * (max - min + 1)) + min; } function startFlash() { clearTimeout(timer); answerEl.textContent = ''; currentNumber = randomNumber(); renderDots(currentNumber, false); statusEl.textContent = 'Schau genau!'; const duration = Number(durationEl.value); timer = setTimeout(() => { renderDots(currentNumber, true); statusEl.textContent = 'Wie viele Punkte waren angemalt?'; }, duration); } function showDots() { clearTimeout(timer); renderDots(currentNumber, false); statusEl.textContent = 'Punktebild'; } function showAnswer() { answerEl.textContent = currentNumber; statusEl.textContent = 'Lösung'; } startBtn.addEventListener('click', startFlash); showBtn.addEventListener('click', showDots); answerBtn.addEventListener('click', showAnswer); document.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startFlash(); } if (e.key.toLowerCase() === 'l') { showAnswer(); } }); renderDots(currentNumber, false); </script> </body> </html>
